<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tranSnovo 健耕医药 — 为生命重塑未来</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #0a1628;
      --bg-navy: #112240;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-light: #f5f5f7;
      --accent: #2B3A6D;
      --pink: #E61E6C;
      --tech-blue: #5B8FF9;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      background: var(--bg-light);
      line-height: 1.6;
      margin: 0;
      overflow-x: hidden;
    }

    /* 导航栏 - 始终显示 */
    #nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid #e0e4ed;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
    }

    .nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 48px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo img { height: 42px; width: auto; }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 8px;
      align-items: center;
    }

    .nav-links > li > a {
      display: block;
      padding: 12px 20px;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
      border-radius: 8px;
    }

    .nav-links > li > a:hover,
    .nav-links > li > a.active {
      color: var(--tech-blue);
      background: rgba(91, 143, 249, 0.08);
    }

    .nav-btn {
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
    }

    .nav-btn:hover {
      background: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(91, 143, 249, 0.2);
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
    }

    .nav-toggle span {
      width: 24px;
      height: 2px;
      background: var(--text-primary);
      transition: all 0.3s;
    }

    .nav-mobile {
      display: none;
      position: fixed;
      top: 80px;
      left: 0;
      right: 0;
      background: #fff;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      z-index: 999;
    }

    .nav-mobile.open { display: block; }

    .nav-mobile a {
      display: block;
      padding: 16px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 16px;
      border-bottom: 1px solid #e0e4ed;
    }

    /* HERO 区域 */
    #hero {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-navy) 100%);
      overflow: hidden;
    }

    .hero-content {
      text-align: center;
      z-index: 10;
      padding: 0 24px;
    }

    .hero-content h1 {
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 800;
      color: var(--text-light);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .hero-content p {
      font-size: clamp(18px, 2.5vw, 24px);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.2em;
    }

    /* 探索按钮 */
    .explore-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.25em;
      animation: pulse 2s ease-in-out infinite;
    }

    .explore-btn-text .cn {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: rgba(255, 255, 255, 1);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .explore-btn-text .en {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
    }

    .explore-btn svg {
      width: 28px;
      height: 28px;
      stroke: rgba(255, 255, 255, 0.95);
      stroke-width: 2.5;
      animation: bounce 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(8px); opacity: 1; }
    }

    /* 响应式 */
    @media (max-width: 1200px) {
      .nav-inner { padding: 0 32px; }
    }

    @media (max-width: 768px) {
      .nav-links, .nav-btn { display: none; }
      .nav-toggle { display: flex; }
      .nav-inner { height: 72px; padding: 0 20px; }
      .hero-content h1 { font-size: clamp(36px, 10vw, 64px); }
      .hero-content p { font-size: clamp(14px, 3vw, 18px); }
    }
  </style>
</head>
<body>

<!-- 导航栏 -->
<nav id="nav">
  <div class="nav-inner">
    <a href="home.html" class="nav-logo">
      <img src="images/logo.png" alt="tranSnovo 健耕医药" />
    </a>

    <ul class="nav-links">
      <li><a href="home.html" class="active">首页</a></li>
      <li><a href="products.html">产品中心</a></li>
      <li><a href="research.html">用户服务</a></li>
      <li><a href="patients.html">关爱患者</a></li>
      <li><a href="talent.html">人才中心</a></li>
    </ul>

    <a href="contact.html" class="nav-btn">联系我们</a>

    <button class="nav-toggle" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="nav-mobile" id="mobileMenu">
    <a href="home.html" onclick="closeMenu()">首页</a>
    <a href="products.html" onclick="closeMenu()">产品中心</a>
    <a href="research.html" onclick="closeMenu()">用户服务</a>
    <a href="patients.html" onclick="closeMenu()">关爱患者</a>
    <a href="talent.html" onclick="closeMenu()">人才中心</a>
    <a href="contact.html" onclick="closeMenu()">联系我们</a>
  </div>
</nav>

<!-- HERO 区域 -->
<section id="hero">
  <div class="hero-content">
    <h1>为生命重塑未来</h1>
    <p>tranSnovo 健耕医药</p>
  </div>

  <!-- 探索按钮 -->
  <a href="index.html" class="explore-btn">
    <div class="explore-btn-text">
      <span class="cn">向下滚动</span>
      <span class="en">Scroll Down</span>
    </div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14M5 12l7 7 7-7"/>
    </svg>
  </a>
</section>

<script>
  function toggleMenu() {
    document.getElementById('mobileMenu').classList.toggle('open');
  }

  function closeMenu() {
    document.getElementById('mobileMenu').classList.remove('open');
  }
</script>

</body>
</html>
